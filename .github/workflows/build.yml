name: Build FakeiOSVersion Dylib  
  
on:  
  push:  
    branches: [ "main", "master" ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: macos-latest  
  
    steps:  
      - name: Checkout Repository  
        uses: actions/checkout@v4  
  
      - name: Select Xcode  
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer  
  
      - name: Compile Dylib for iOS (arm64)  
        run: |  
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \  
            -fobjc-arc \  
            -framework Foundation -framework UIKit \  
            -install_name @executable_path/FakeiOSVersion.dylib \  
            FakeiOSVersion.m \  
            -o FakeiOSVersion.dylib  
  
      - name: Upload Artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: FakeiOSVersion-dylib  
          path: FakeiOSVersion.dylib  
  
      - name: Create Release  
        uses: softprops/action-gh-release@v2  
        if: startsWith(github.ref, 'refs/tags/')  
        with:  
          files: FakeiOSVersion.dylib  
        env:  
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
