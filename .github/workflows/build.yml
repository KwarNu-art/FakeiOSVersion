name: Build FakeiOSVersion Dylib  
  
on:  
  push:  
    branches: [ "main", "master" ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: macos-latest  
  
    steps:  
      - name: Checkout Repository  
        uses: actions/checkout@v4  
  
      - name: Verify Repository Files  
        run: ls -la  
  
      - name: Compile Dylib for iOS (arm64)  
        run: |  
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -miphoneos-version-min=14.0 -fobjc-arc -framework Foundation -framework UIKit -install_name @executable_path/FakeiOSVersion.dylib FakeiOSVersion.m -o FakeiOSVersion.dylib  
  
      - name: Upload Dylib Artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: FakeiOSVersion-dylib  
          path: FakeiOSVersion.dylib
